<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="60" y1="40" x2="450" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="65%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Inner Glow -->
    <linearGradient id="inner-glow" x1="256" y1="24" x2="256" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Wallet Body Gradient -->
    <linearGradient id="wallet-bg" x1="120" y1="160" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="160" y1="130" x2="350" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="gold-grad" x1="310" y1="240" x2="400" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Coin Inner Gradient -->
    <linearGradient id="coin-inner" x1="330" y1="260" x2="385" y2="315" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#022c22" flood-opacity="0.5"/>
    </filter>

    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#022c22" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- App Squircle Canvas (Icon Container) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg-grad)" filter="url(#shadow-main)"/>
  <rect x="20" y="20" width="472" height="472" rx="104" stroke="url(#inner-glow)" stroke-width="6"/>

  <!-- Subtle Decorative Cash Glow Behind -->
  <circle cx="256" cy="270" r="140" fill="#a7f3d0" opacity="0.12"/>

  <!-- Bank Card Slot (Peeking out of Wallet) -->
  <g transform="translate(0, 0)">
    <rect x="170" y="145" width="172" height="100" rx="18" fill="url(#card-grad)" filter="url(#shadow-main)"/>
    <rect x="170" y="145" width="172" height="100" rx="18" stroke="#7dd3fc" stroke-width="3" opacity="0.6"/>
    <!-- Card Chip / Line -->
    <rect x="190" y="165" width="28" height="22" rx="5" fill="#fef08a" opacity="0.9"/>
    <line x1="230" y1="172" x2="315" y2="172" stroke="#bae6fd" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <line x1="230" y1="184" x2="280" y2="184" stroke="#bae6fd" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Main Wallet Body -->
  <g filter="url(#shadow-main)">
    <!-- Base Wallet Case -->
    <rect x="116" y="185" width="280" height="185" rx="28" fill="url(#wallet-bg)"/>
    <!-- Sleek Emerald Edge Outline -->
    <rect x="116" y="185" width="280" height="185" rx="28" stroke="#34d399" stroke-width="6"/>
    <rect x="122" y="191" width="268" height="173" rx="22" stroke="#6ee7b7" stroke-width="2" opacity="0.3"/>

    <!-- Wallet Front Horizontal Seam / Pocket Divider -->
    <path d="M 116 265 C 190 275, 306 275, 396 265" stroke="#10b981" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <!-- Wallet Flap (Fold on right) -->
    <path d="M 285 235 L 388 235 C 394 235, 398 239, 398 245 L 398 310 C 398 316, 394 320, 388 320 L 285 320 C 265 320, 250 300, 250 277.5 C 250 255, 265 235, 285 235 Z"
          fill="#034e3b" stroke="#34d399" stroke-width="5"/>
  </g>

  <!-- Big Gold Coin Clasp / Emblem -->
  <g filter="url(#coin-shadow)">
    <!-- Outer Gold Rim -->
    <circle cx="340" cy="278" r="48" fill="url(#gold-grad)"/>
    <circle cx="340" cy="278" r="48" stroke="#fef08a" stroke-width="3"/>

    <!-- Inner Coin Disc -->
    <circle cx="340" cy="278" r="37" fill="url(#coin-inner)"/>
    <circle cx="340" cy="278" r="37" stroke="#b45309" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Currency Symbol "Rp" (Embossed) -->
    <text x="340" y="287" text-anchor="middle" font-size="25" font-weight="900" fill="#78350f" font-family="'Segoe UI', Roboto, sans-serif" letter-spacing="-0.5">Rp</text>
    <!-- Specular Highlight on Coin -->
    <ellipse cx="325" cy="254" rx="12" ry="5" fill="#ffffff" opacity="0.55" transform="rotate(-30 325 254)"/>
  </g>

  <!-- Sparkles (Prosperity / Clean Finance) -->
  <!-- Top Right Sparkle -->
  <path d="M 390 135 Q 405 135 405 120 Q 405 135 420 135 Q 405 135 405 150 Q 405 135 390 135 Z" fill="#ffffff" opacity="0.95"/>
  <circle cx="405" cy="135" r="3" fill="#fef08a"/>

  <!-- Left Small Sparkle -->
  <path d="M 105 200 Q 115 200 115 190 Q 115 200 125 200 Q 115 200 115 210 Q 115 200 105 200 Z" fill="#ffffff" opacity="0.8"/>

  <!-- Bottom Mini Sparkle -->
  <circle cx="150" cy="350" r="4" fill="#a7f3d0" opacity="0.75"/>
</svg>